services:
  # 1. NGINX - The only entry point for web traffic
  nginx:
    image: nginx:alpine
    ports:
      - "81:80"   # HTTP
    volumes:
      - ./frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - frontend
      - backend



  backend:
    build: ./backend
    env_file: .env
    # ports:
      # - "8000:8000"   # HTTP
    volumes:
      - ./backend:/app
 

  frontend:
    build: ./frontend
    # ports:
      # - "80:80"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend