services:
  # 1. NGINX - The only entry point for web traffic
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"   # HTTP
      - "443:443" # HTTPS
    volumes:
      - ./frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/localhost+2.pem:/etc/nginx/certs/localhost.pem:ro
      - ./certs/localhost+2-key.pem:/etc/nginx/certs/localhost-key.pem:ro
    depends_on:
      - frontend
      - backend

