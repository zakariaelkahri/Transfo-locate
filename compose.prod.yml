services:
  # 1. NGINX - The only entry point for web traffic
  nginx:
    image: nginx:alpine
    ports:
      - "81:80"
    volumes:
      - ./frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - frontend
      - backend


  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
 

  frontend:
    build: ./frontend
    # ports:
      # - "80:80"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend


  db:
    image: postgres:16-alpine
    container_name: energy-locate-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    restart: unless-stopped


  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: energy-locate-pgadmin
    env_file: .env
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    restart: unless-stopped


volumes:
  postgres_data:
  pgadmin_data:
